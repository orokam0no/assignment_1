<main>
  <center>
    <section id="account-access">
      <h2>Member Portal</h2>
      <p>Log in to your athlete account or register as a new member.</p>

      <br>

      <!-- Форма Входа -->
      <article>
        <form action="#" method="post">
          <fieldset>
            <legend><strong>Sign In (Вход)</strong></legend>
            <br>
            <p>
              <label for="login-email">Email Address:</label><br>
              <input type="email" id="login-email" name="login_email" placeholder="name@example.com" required>
            </p>

            <p>
              <label for="login-password">Password:</label><br>
              <input type="password" id="login-password" name="login_password" required>
            </p>

            <p>
              <input type="submit" value="Log In">
            </p>
          </fieldset>
        </form>
      </article>

      <br><hr><br>

      <!-- Форма Регистрации -->
      <article>
        <form action="#" method="post">
          <fieldset>
            <legend><strong>Create Account (Регистрация)</strong></legend>
            <br>
            <p>
              <label for="reg-name">Full Name:</label><br>
              <input type="text" id="reg-name" name="reg_name" placeholder="First and last name" required>
            </p>

            <p>
              <label for="reg-email">Email Address:</label><br>
              <input type="email" id="reg-email" name="reg_email" placeholder="name@example.com" required>
            </p>

            <p>
              <label for="reg-password">Create Password:</label><br>
              <input type="password" id="reg-password" name="reg_password" required>
            </p>

            <p>
              <label for="membership-level">Membership Goal:</label><br>
              <select id="membership-level" name="membership_level">
                <option value="beginner">Beginner / Fundamentals</option>
                <option value="amateur">Amateur Boxer</option>
                <option value="pro">Sparring &amp; Pro Prep</option>
              </select>
            </p>

            <p>
              <input type="submit" value="Register Account">
              <input type="reset" value="Clear Form">
            </p>
          </fieldset>
        </form>
      </article>
    </section>
  </center>
</main>
