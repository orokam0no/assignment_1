<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book a boxing session, ring time, or initial assessment at Old School Boxing Club.">
  <title>Old School Boxing Club - Booking</title>
</head>

<body>

<header>
  <h1>OLD SCHOOL BOXING CLUB</h1>

  <nav>
    <a href="index.html">HOME</a> |
    <a href="equipment.html">EQUIPMENT</a> |
    <a href="booking.html">BOOKING</a> |
    <a href="prices.html">PRICES</a> |
    <a href="trainers.html">TRAINERS</a> |
    <a href="colophon.html">COLOPHON</a>
  </nav>
</header>

<hr>

<main>
  <section>
    <h2>Book Your Boxing Session</h2>
    <p>Fill out the form below to reserve an introductory workout or schedule private coaching.</p>

    <form method="post" action="#">
      <fieldset>
        <legend>Contact Information</legend>

        <label for="b-name">Full Name:</label><br>
        <input type="text" id="b-name" name="b-name" placeholder="John Doe" required><br>

        <label for="b-email">Email Address:</label><br>
        <input type="email" id="b-email" name="b-email" placeholder="john@example.com" required><br>

        <label for="b-phone">Phone Number:</label><br>
        <input type="tel" id="b-phone" name="b-phone" placeholder="+7 700 000 00 00" required>
      </fieldset>

      <fieldset>
        <legend>Session Details</legend>

        <label for="b-coach">Preferred Coach:</label><br>
        <select id="b-coach" name="b-coach" required>
          <option value="">Select a Coach</option>
          <option value="Renat">Renat Latypov (Head Coach)</option>
          <option value="Rustem">Rustem Makishev (Power & Sparring)</option>
          <option value="Evgenia">Evgenia Makoviy (Speed & Footwork)</option>
        </select><br>

        <label for="b-date">Preferred Date:</label><br>
        <input type="date" id="b-date" name="b-date" required><br>

        <p>Training Goals:</p>
        <input type="checkbox" id="goal-technique" name="goal" value="technique">
        <label for="goal-technique">Boxing Fundamentals & Stance</label><br>

        <input type="checkbox" id="goal-sparring" name="goal" value="sparring">
        <label for="goal-sparring">Sparring Preparation</label><br>

        <input type="checkbox" id="goal-cardio" name="goal" value="cardio">
        <label for="goal-cardio">Cardio & Weight Loss</label><br><br>

        <label for="b-notes">Additional Notes:</label><br>
        <textarea id="b-notes" name="b-notes" rows="4" placeholder="Mention your boxing experience level..."></textarea>
      </fieldset>

      <input type="submit" value="Submit Reservation">
      <input type="reset" value="Clear Form">
    </form>
  </section>
</main>

<hr>

<footer>
  <p><small>&copy; 2026 Old School Boxing Club.</small></p>
</footer>

</body>
</html>
